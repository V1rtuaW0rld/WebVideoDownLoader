#https://wvdl.virtuaworld.org
# ---------------------------------------------------------
# Pour forcer la reconstruction de l'image (et télécharger
# la toute dernière version de yt-dlp depuis GitHub) :
# 👉 docker-compose build --no-cache
# puis
# 👉 docker-compose up -d
# ---------------------------------------------------------

services:
  wvdl:
    container_name: wvdl
    build: .
    image: wvdl:latest
    ports:
      # Port hôte paramétrable via .env (WVDL_PORT). Défaut 5000 si non défini.
      - "${WVDL_PORT:-5000}:5000"
    volumes:
      - /mnt/nas/video/yt-dlp:/app/downloads:rw
      - ./app_db:/app/db:rw
      - ./cache:/app/cache:rw
      - ./logs:/app/logs:rw
      - ./cookies:/app/cookies:rw
    restart: unless-stopped
    environment:
      - WVDL_OUTPUT_DIR=/app/downloads
      - WVDL_DB_PATH=/app/db/bdd.sqlite
      - WVDL_COOKIES_DIR=/app/cookies
